<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#28583e">
  <meta name="description" content="이달의 제철 재료로 찾아보는 오늘의 메뉴와 레시피">
  <title>오늘 뭐먹지? · 제철 식탁</title>
  <style>
    :root{--green:#28583e;--ink:#24382b;--muted:#687266;--line:#e0e5d9;--paper:#f8f9f3;--lime:#e6edba}
    *{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:"맑은 고딕","Apple SD Gothic Neo",sans-serif;line-height:1.6}button,select{font:inherit}button,select,summary{cursor:pointer}button:focus-visible,select:focus-visible,summary:focus-visible{outline:3px solid #ba790c;outline-offset:4px}
    .wrap{max-width:1160px;margin:auto;padding:0 30px}header{border-bottom:1px solid var(--line);background:#fffdf7}.top{min-height:86px;display:flex;justify-content:space-between;align-items:center;gap:20px}.brand{font-size:23px;font-weight:800;letter-spacing:-1px}.brand span{color:var(--green)}.month-control{display:flex;align-items:center;gap:12px;font-size:14px}.month-control select{border:1px solid #cbd4c4;border-radius:10px;padding:9px 38px 9px 15px;background:#fff;color:var(--green);font-weight:700}
    .hero{padding:54px 0 35px;display:flex;align-items:center;justify-content:space-between;gap:20px}.eyebrow{font-size:12px;font-weight:800;letter-spacing:2px;color:var(--green)}h1{font-size:clamp(30px,4.3vw,48px);line-height:1.35;letter-spacing:-2px;margin:12px 0 16px}h1 em{font-style:normal;color:var(--green)}.intro{margin:0;color:var(--muted);font-size:15px}.season-stamp{width:125px;height:125px;flex-shrink:0;border:1px solid #b9c5aa;border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;transform:rotate(8deg);color:var(--green);background:#eff2df}.season-stamp strong{font-size:34px;line-height:1.2}.season-stamp small{font-size:11px;letter-spacing:2px}
    .ingredients-panel{background:#fffdf7;border:1px solid var(--line);border-radius:18px;padding:24px 28px;margin-bottom:42px}.panel-heading{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:17px}.panel-heading h2{font-size:16px;margin:0}.panel-heading p{margin:0;color:var(--muted);font-size:13px}.ingredients{display:flex;flex-wrap:wrap;gap:10px}.chip{border:1px solid #dbe1d1;background:white;border-radius:100px;padding:9px 20px;color:#53634f;transition:background .15s,transform .15s}.chip:hover{background:#eef2e4;transform:translateY(-2px)}.chip[aria-pressed="true"]{background:var(--green);border-color:var(--green);color:white}.chip[aria-pressed="true"]::before{content:'✓ ';font-size:13px}
    .results-heading{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:20px}.results-heading h2{font-size:23px;letter-spacing:-.7px;margin:0}.count{font-size:14px;color:var(--muted);white-space:nowrap}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:26px 22px;padding-bottom:50px}.card{background:white;border:1px solid var(--line);border-radius:16px;overflow:hidden;transition:transform .2s,box-shadow .2s}.card:hover{transform:translateY(-4px);box-shadow:0 10px 25px #203b2010}.photo{aspect-ratio:16/10;background:#e9eddf;position:relative;display:flex;align-items:center;justify-content:center}.photo img{width:100%;height:100%;object-fit:cover;position:absolute;inset:0}.photo .fallback{color:#617153;font-size:14px}.card-body{padding:20px}.category{display:inline-block;background:#f0f3e7;color:#49603b;padding:3px 9px;border-radius:5px;font-size:11px;font-weight:700}.card h3{font-size:18px;letter-spacing:-.6px;line-height:1.5;margin:10px 0}.meta{font-size:12px;color:var(--muted);margin:0}.tags{font-size:12px;color:var(--green);margin:12px 0 0}details{border-top:1px solid var(--line);margin-top:17px;padding-top:12px;font-size:13px}summary{color:var(--green);font-weight:700}details h4{margin:16px 0 7px;font-size:13px}.recipe-text{white-space:pre-line;overflow-wrap:anywhere;color:#53604f}ol{padding-left:20px;color:#53604f}li+li{margin-top:8px}.empty{grid-column:1/-1;text-align:center;padding:65px 24px;border:1px dashed #c7d1bd;border-radius:16px;background:#fffdf7}.empty strong{font-size:20px}.empty p{color:var(--muted);margin:8px 0}.retry{margin-top:14px;border:0;background:var(--green);color:#fff;border-radius:8px;padding:10px 20px}footer{border-top:1px solid var(--line);padding:24px 0;color:var(--muted);font-size:12px}.footer-inner{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}button:disabled,select:disabled{opacity:.5;cursor:wait}
    @media(max-width:850px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.season-stamp{width:105px;height:105px}.wrap{padding:0 22px}}
    @media(max-width:540px){.wrap{padding:0 18px}.top{min-height:76px;gap:12px}.brand{font-size:20px}.month-control{gap:7px}.month-control label{font-size:12px}.month-control select{padding:8px 10px}.hero{padding:36px 0 28px}.season-stamp{display:none}.intro{font-size:13px}.ingredients-panel{padding:20px;margin-bottom:30px}.chip{padding:8px 16px}.grid{grid-template-columns:1fr;gap:20px}.results-heading h2{font-size:20px}.card h3{font-size:19px}.photo{aspect-ratio:16/9}}
    @media(prefers-reduced-motion:reduce){*{transition:none!important}}
  </style>
</head>
<body>
  <header><div class="wrap top"><div class="brand">오늘 <span>뭐먹지?</span></div><div class="month-control"><label for="month">계절을 골라요</label><select id="month" disabled></select></div></div></header>
  <main class="wrap">
    <section class="hero" aria-labelledby="hero-title"><div><div class="eyebrow">SEASONAL TABLE · 제철 식탁</div><h1 id="hero-title"><em id="hero-month"></em>, 제철로 차리는<br>오늘의 한 끼.</h1><p class="intro">지금 가장 맛있는 재료로, 오늘의 메뉴 고민을 덜어보세요.</p></div><div class="season-stamp" aria-hidden="true"><small>IN SEASON</small><strong id="stamp-month"></strong><small>제철의 맛</small></div></section>
    <section class="ingredients-panel" aria-labelledby="ingredients-title"><div class="panel-heading"><h2 id="ingredients-title">이달의 제철 재료</h2><p>먹고 싶은 재료를 선택해 보세요.</p></div><div class="ingredients" id="ingredients"></div></section>
    <section aria-labelledby="results-title"><div class="results-heading"><h2 id="results-title">이달의 추천 메뉴</h2><span class="count" id="count" role="status" aria-live="polite"></span></div><div class="grid" id="recipes" aria-busy="true"><div class="empty" role="status">제철 메뉴를 불러오고 있어요.</div></div></section>
  </main>
  <footer><div class="wrap footer-inner"><span>오늘 뭐먹지? · 계절을 담은 작은 식탁</span><span>레시피·사진: 제공된 menu.json / 식품안전나라</span></div></footer>
  <script>
    'use strict';
    const monthSelect = document.getElementById('month');
    const ingredientsEl = document.getElementById('ingredients');
    const recipesEl = document.getElementById('recipes');
    const countEl = document.getElementById('count');
    let data = null;
    let selectedIngredient = '';
    for (let month = 1; month <= 12; month++) {
      const option = document.createElement('option');
      option.value = month;
      option.textContent = month + '월';
      monthSelect.append(option);
    }
    monthSelect.value = new Date().getMonth() + 1;
    function updateMonthTitle() {
      document.getElementById('hero-month').textContent = monthSelect.value + '월';
      document.getElementById('stamp-month').textContent = monthSelect.value + '월';
    }
    updateMonthTitle();
    function element(tag, className, text) {
      const node = document.createElement(tag);
      if (className) node.className = className;
      if (text !== undefined) node.textContent = text;
      return node;
    }
    function cleanText(value) { return String(value ?? '').replace(/<br\s*\/?\s*>/gi, '\n'); }
    function renderIngredients() {
      const month = Number(monthSelect.value);
      const names = [...new Set(data.seasonal.filter(item => item.month === month).map(item => item.name))];
      ingredientsEl.replaceChildren();
      for (const name of ['', ...names]) {
        const button = element('button', 'chip', name || '전체');
        button.type = 'button';
        button.setAttribute('aria-pressed', String(selectedIngredient === name));
        button.addEventListener('click', () => {
          selectedIngredient = name;
          renderIngredients();
          renderRecipes();
        });
        ingredientsEl.append(button);
      }
    }
    function recipeCard(recipe) {
      const card = element('article', 'card');
      const photo = element('div', 'photo');
      const fallback = element('span', 'fallback', '사진을 준비하고 있어요');
      photo.append(fallback);
      if (recipe.image) {
        const img = element('img');
        img.alt = recipe.name;
        img.loading = 'lazy';
        img.decoding = 'async';
        img.addEventListener('error', () => { img.remove(); fallback.textContent = '사진을 불러올 수 없어요'; });
        img.addEventListener('load', () => { fallback.hidden = true; });
        img.src = recipe.image;
        photo.append(img);
      }
      const body = element('div', 'card-body');
      body.append(element('span', 'category', recipe.category || '요리'), element('h3', '', recipe.name));
      body.append(element('p', 'meta', [recipe.method, recipe.kcal != null ? recipe.kcal + ' kcal' : ''].filter(Boolean).join(' · ')));
      body.append(element('p', 'tags', (recipe.seasonal || []).map(name => '# ' + name).join('  ')));
      const details = element('details');
      details.append(element('summary', '', '레시피 보기'), element('h4', '', '준비 재료'), element('div', 'recipe-text', cleanText(recipe.ingredients_text)));
      if (recipe.steps?.length) {
        const steps = element('ol');
        recipe.steps.forEach(step => steps.append(element('li', '', cleanText(step))));
        details.append(element('h4', '', '만드는 방법'), steps);
      }
      if (recipe.tip) details.append(element('h4', '', '요리 팁'), element('p', 'recipe-text', cleanText(recipe.tip)));
      body.append(details);
      card.append(photo, body);
      return card;
    }
    function renderRecipes() {
      const month = Number(monthSelect.value);
      const recipes = data.recipes.filter(recipe => recipe.months.includes(month) && (!selectedIngredient || recipe.seasonal.includes(selectedIngredient)));
      document.getElementById('results-title').textContent = selectedIngredient ? selectedIngredient + '로 만드는 한 끼' : '이달의 추천 메뉴';
      countEl.textContent = '총 ' + recipes.length + '개 메뉴';
      recipesEl.replaceChildren();
      if (recipes.length) recipesEl.append(...recipes.map(recipeCard));
      else {
        const empty = element('div', 'empty');
        empty.append(element('strong', '', '조건에 맞는 레시피가 없어요.'), element('p', '', '다른 재료나 다른 월을 선택해 보세요.'));
        recipesEl.append(empty);
      }
      recipesEl.setAttribute('aria-busy', 'false');
    }
    monthSelect.addEventListener('change', () => {
      selectedIngredient = '';
      updateMonthTitle();
      renderIngredients();
      renderRecipes();
    });
    async function loadMenu() {
      recipesEl.setAttribute('aria-busy', 'true');
      try {
        const response = await fetch('./menu.json');
        if (!response.ok) throw new Error('HTTP ' + response.status);
        data = await response.json();
        if (!Array.isArray(data.seasonal) || !Array.isArray(data.recipes)) throw new Error('Invalid menu data');
        monthSelect.disabled = false;
        renderIngredients();
        renderRecipes();
      } catch (error) {
        recipesEl.replaceChildren();
        countEl.textContent = '';
        const empty = element('div', 'empty');
        empty.setAttribute('role', 'alert');
        empty.append(element('strong', '', '메뉴 데이터를 불러오지 못했어요.'), element('p', '', 'menu.json이 같은 폴더에 있는지 확인해 주세요.'));
        empty.append(element('p', '', location.protocol === 'file:' ? 'fetch로 데이터를 읽으려면 VS Code의 Live Server 등으로 index.html을 열어 주세요.' : '연결을 확인하고 다시 시도해 주세요.'));
        const retry = element('button', 'retry', '다시 불러오기');
        retry.type = 'button';
        retry.addEventListener('click', loadMenu);
        empty.append(retry);
        recipesEl.append(empty);
        recipesEl.setAttribute('aria-busy', 'false');
      }
    }
    loadMenu();
  </script>
</body>
</html>
